<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="search">
    <input type="text" placeholder="Enter city name" spellcheck="false">
    <button>🔍</button>
  </div>

  <!-- Loading -->
  <div class="loading">Loading...</div>

  <!-- Error -->
  <div class="error">
    <p>❌ City not found</p>
  </div>

  <!-- Weather -->
  <div class="weather">
    <img src="images/clear.png" class="weather-icon">

    <h1 class="temp"></h1>
    <h2 class="city"></h2>

    <div class="details">
      <div class="col">
        <img src="images/humidity.png">
        <div>
          <p class="humidity"></p>
          <p>Humidity</p>
        </div>
      </div>

      <div class="col">
        <img src="images/wind.png">
        <div>
          <p class="wind"></p>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
